# Personae — Hermes Desktop plugin (community catalog entry).
#
# `sha:` is the release: a commit carrying the desktop/ layout, the root
# plugin.yaml and the desktop/plugin.js this entry describes. A re-pin bumps
# `sha` and `version` together in a new PR; the image URLs below are pinned to
# the same sha, so they move with it.
name: personae
repo: https://github.com/SmoothMarx/personae
sha: 0320ccba41ffdb7c6035db6d3fc2800d6ba14f30
description: "Two views of every profile's sessions, in one pane. Roster: a row per profile that expands into its own live sessions, with per-profile colour, sections, status lights, search, groups, multi-select and an Apropos beta that starts a new session already knowing the ones you picked. Flat list: every profile's sessions in ONE stream ordered by activity, each row carrying its profile's picture and name, filed into Unread / Running / Read — with the same groups, search, archive and row menu. Both tabs are hideable from the tab menu, so you keep the view you use. Disclosure — a Desktop pane over all your local profiles: it reads each profile's sessions, cron jobs and settings through the app's own requests and, only when you click, creates, opens, deletes or archives sessions (deletes ask first), changes cron jobs or edits profile settings; Apropos starts a new session with a hidden pointer message naming the sessions you picked; no network calls or telemetry."
maintainer: SmoothMarx
tier: community
category: desktop
version: "2.0.0"
image: https://raw.githubusercontent.com/SmoothMarx/personae/0320ccba41ffdb7c6035db6d3fc2800d6ba14f30/assets/personae-pane.png
screenshots:
  - https://raw.githubusercontent.com/SmoothMarx/personae/0320ccba41ffdb7c6035db6d3fc2800d6ba14f30/assets/personae-pane.png
platforms: [linux, macos, windows]
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env: []
requires_hermes: ">=0.21.6"
